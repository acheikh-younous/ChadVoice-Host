{% extends 'base.html' %}
{% block content %}
<section class="panel" style="max-width:600px;margin:2rem auto;padding:2rem">
<h1>Création du premier administrateur</h1>
<p>Cette page devient inaccessible dès qu'un administrateur est créé. Retirez ensuite le jeton de Render.</p>
{% if error %}<p role="alert" style="color:#b91c1c">{{error}}</p>{% endif %}
<form method="post" action="/setup">
<label>Jeton secret d'initialisation</label><input name="token" type="password" required autocomplete="off">
<label>Nom complet</label><input name="full_name" required maxlength="200">
<label>E-mail</label><input name="email" type="email" required>
<label>Mot de passe (au moins 10 caractères)</label><input name="password" type="password" minlength="10" required>
<button type="submit">Créer le compte administrateur</button>
</form></section>
{% endblock %}
